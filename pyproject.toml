[project]
name = "employee-management-api"
version = "1.0.0"
description = "Employee management REST API with FastAPI, SQLAlchemy and Redis caching"
requires-python = ">=3.11"

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
# B008: FastAPI's Depends()/Query() in defaults is the framework's idiomatic pattern
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
